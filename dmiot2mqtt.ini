[mqtt]
server = mqttserver.example.org
port = 1883
base_topic = dmiot2mqtt
; user = username
; password = password
use_ssl = 0
; Publish the fan state as retained message, so Home Assistant knows it right after a restart.
retain = 0
; Identify fans in the MQTT topic by "ip" or "device_id" (no static IP needed).
topic_id = ip

[bridge]
; Seconds without any data before a fan connection is treated as dead (0 or less = never).
read_timeout = 90
